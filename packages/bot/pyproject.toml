[project]
name = "crm-bot"
version = "0.1.0"
description = "MCP server and PydanticAI agent interface for rti-obs-crm"
requires-python = ">=3.12"
dependencies = [
    "crm-core",
    "mcp>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_bot"]
