[project]
name = "crm-api"
version = "0.1.0"
description = "FastAPI REST interface for rti-obs-crm"
requires-python = ">=3.12"
dependencies = [
    "crm-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_api"]
