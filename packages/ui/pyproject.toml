[project]
name = "crm-ui"
version = "0.1.0"
description = "Streamlit dashboard for rti-obs-crm (datapizza-inspired)"
requires-python = ">=3.12"
dependencies = [
    "crm-core",
    "streamlit>=1.35",
    "pandas>=2.2",
    "plotly>=5.22",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_ui"]
