[project]
name = "crm-core"
version = "0.1.0"
description = "Core domain models, vault service, and DAG engine for rti-obs-crm"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "duckdb>=1.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_core"]
