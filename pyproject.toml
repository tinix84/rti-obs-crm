[project]
name = "rti-obs-crm"
version = "0.1.0"
description = "Agent CRM powered by Obsidian vault + DAG orchestration"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/api",
    "packages/bot",
    "packages/ui",
]

[tool.uv.sources]
crm-core = { workspace = true }
crm-api  = { workspace = true }
crm-bot  = { workspace = true }
crm-ui   = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",         # for FastAPI test client
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["packages/core/tests", "packages/api/tests", "packages/bot/tests"]
